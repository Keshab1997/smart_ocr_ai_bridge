name: smart_ocr_ai_bridge
description: >-
  Reusable Flutter package combining 5-script on-device ML Kit OCR with
  admin_api_key_manager auto-failover to cut LLM vision token usage by ~90%.
version: 1.0.0
homepage: https://github.com/Keshab1997/smart_ocr_ai_bridge
repository: https://github.com/Keshab1997/smart_ocr_ai_bridge
issue_tracker: https://github.com/Keshab1997/smart_ocr_ai_bridge/issues

environment:
  sdk: ^3.4.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.15.0
  http: ^1.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
